<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <circle cx="320" cy="240" r="220" fill="url(#glow)"/>
  <ellipse cx="320" cy="405" rx="200" ry="26" fill="#020617" opacity="0.7"/>
  <!-- Battery Body 3D Perspective -->
  <path d="M120 140 L520 140 L505 375 C504 386 495 395 484 395 L156 395 C145 395 136 386 135 375 Z" fill="url(#caseGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Side Ribs -->
  <rect x="148" y="180" width="12" height="180" rx="4" fill="#0f172a"/>
  <rect x="480" y="180" width="12" height="180" rx="4" fill="#0f172a"/>
  <!-- Top Lid -->
  <rect x="112" y="112" width="416" height="44" rx="10" fill="url(#lidGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="112" y="144" width="416" height="10" fill="url(#amberGrad)"/>
  <!-- Terminals -->
  <rect x="172" y="82" width="36" height="30" rx="4" fill="#94a3b8"/>
  <rect x="166" y="76" width="48" height="10" rx="3" fill="#ef4444"/>
  <text x="190" y="103" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-weight="bold" font-size="16">+</text>
  <rect x="432" y="82" width="36" height="30" rx="4" fill="#94a3b8"/>
  <rect x="426" y="76" width="48" height="10" rx="3" fill="#38bdf8"/>
  <text x="450" y="103" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-weight="bold" font-size="18">-</text>
  <!-- Center Label -->
  <rect x="175" y="185" width="290" height="165" rx="12" fill="#0b1120" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="320" y="232" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif" font-weight="900" font-size="26" letter-spacing="3">EVERLEAD</text>
  <text x="320" y="256" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-weight="600" font-size="12" letter-spacing="4">AGM / EFB PERFORMANCE</text>
  <!-- Lightning Bolt -->
  <path d="M332 272 L302 308 L320 308 L310 338 L342 300 L324 300 Z" fill="url(#amberGrad)"/>
  <text x="225" y="325" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-weight="700" font-size="13">12V</text>
  <text x="415" y="325" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-weight="700" font-size="13">760 CCA</text>
</svg>
